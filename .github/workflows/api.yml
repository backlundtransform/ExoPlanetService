name: API

# Builds the .NET 10 API and checks it against the recorded legacy contract
# (tests/contract/shapes). Value comparison needs the full recordings, which are not
# in git, so CI checks shapes only; run `verify.py --values` locally for parity.
on:
  push:
    paths:
      - 'src/**'
      - 'data/**'
      - 'tests/contract/**'
      - 'ExoplanetHunter.slnx'
      - '.github/workflows/api.yml'
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build
        run: dotnet build ExoplanetHunter.slnx -c Release -warnaserror

      - name: Start API
        run: |
          dotnet src/ExoplanetHunter.Api/bin/Release/net10.0/ExoplanetHunter.Api.dll --urls http://localhost:5099 &
          for i in $(seq 1 30); do curl -sf http://localhost:5099/health && exit 0; sleep 1; done
          echo "API did not become healthy" && exit 1

      - name: Verify contract
        run: python tests/contract/verify.py --base http://localhost:5099
